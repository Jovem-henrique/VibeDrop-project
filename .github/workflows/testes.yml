name: Testes Python
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Atualizar pip
        run: python -m pip install --upgrade pip
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Testes offline
        run: python -m unittest discover -s tests -v
      - name: Validar build Docker completo
        run: docker build --pull --tag vibedrop:ci .
