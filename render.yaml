# Render Blueprint: instancia gratuita para uso leve entre amigos.
# A senha nunca vai para o GitHub, sera solicitada pela Render no cadastro.
services:
  - type: web
    name: vibedrop-project
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ACCESS_CODE
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: PUBLIC_HTTPS
        value: '1'
      - key: MIN_FREE_GB
        value: '0.1'
      - key: MAX_FILE_MB
        value: '370'
      - key: MAX_SIMULTANEOUS
        value: '1'
      - key: CLIENT_COOLDOWN_SECONDS
        value: '60'
      - key: PREVIEW_HOURLY_LIMIT
        value: '20'
      - key: RESULT_TTL_MINUTES
        value: '10'
